name: Translate posts

on:
  push:
    paths:
      - 'posts/pl/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Translate Polish posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node .github/workflows/translate.mjs
      - name: Commit translations
        run: |
          git config user.name "foresthydrology-bot"
          git config user.email "actions@github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "Auto-translate posts"
          git push
